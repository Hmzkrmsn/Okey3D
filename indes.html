
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Okey 3D Cafe</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial}
#ui{
position:fixed;top:15px;left:15px;
background:#182536dd;color:white;
padding:15px;border-radius:12px;
z-index:2;line-height:1.8
}
#tip{color:#a9d5ff;font-size:13px}
</style>
</head>
<body>
<div id="ui">
<b>OKEY 3D CAFE</b><br>
WASD : Hareket<br>
Fare : Kamerayı döndür<br>
<span id="tip">Kahvehaneye hoş geldin!</span>
</div>
<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bc4dc);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(8,15,8);
sun.castShadow=true;
scene.add(sun);

function cube(w,h,d,c,x,y,z){
const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({color:c}));
m.position.set(x,y,z);
m.castShadow=true;m.receiveShadow=true;
scene.add(m);return m;
}
function cylinder(r,h,c,x,y,z){
const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,8),
new THREE.MeshStandardMaterial({color:c}));
m.position.set(x,y,z);m.castShadow=true;scene.add(m);
return m;
}

// Zemin ve duvarlar
cube(50,1,50,0x829b70,0,-.5,0);
cube(50,9,1,0xe6d5b9,0,4.5,-12);
cube(1,9,25,0xcdbb9f,-12,4.5,0);
cube(1,9,25,0xcdbb9f,12,4.5,0);

// Okey masası
cube(4,.3,3,0x75472b,0,1.5,0);
for(let x of [-1.5,1.5])
for(let z of [-1,1])
cube(.25,1.5,.25,0x493020,x,.75,z);

// Okey taşları
const colors=[0xe74c3c,0x3285dc,0x2ca66b,0xe5d8b7];
for(let i=0;i<16;i++){
cube(.35,.17,.55,colors[i%4],
-1.5+(i%8)*.42,1.74,-.5+Math.floor(i/8)*.8);
}

// Sandalyeler
for(let a=0;a<4;a++){
const angle=a*Math.PI/2;
const x=Math.sin(angle)*3;
const z=Math.cos(angle)*2.5;
cube(1,.3,1,0x80502c,x,.8,z);
cube(1.1,1.3,.2,0x80502c,x,1.4,z+Math.cos(angle)*.5);
}

// Karakter
const player=new THREE.Group();
const blue=new THREE.MeshStandardMaterial({color:0x2585dc});
const skin=new THREE.MeshStandardMaterial({color:0xffc38e});
const dark=new THREE.MeshStandardMaterial({color:0x252b35});

const body=new THREE.Mesh(new THREE.CylinderGeometry(.35,.45,1.1,6),blue);
body.position.y=1.25;player.add(body);

const head=new THREE.Mesh(new THREE.IcosahedronGeometry(.4,1),skin);
head.position.y=2.1;player.add(head);

for(let x of [-.22,.22]){
const leg=new THREE.Mesh(new THREE.BoxGeometry(.2,.8,.2),dark);
leg.position.set(x,.4,0);player.add(leg);
}
for(let x of [-.45,.45]){
const arm=new THREE.Mesh(new THREE.BoxGeometry(.2,.85,.2),skin);
arm.position.set(x,1.35,0);player.add(arm);
}
player.position.set(0,0,6);
scene.add(player);

// Çay bardağı
const glass=new THREE.Mesh(
new THREE.CylinderGeometry(.16,.12,.4,12),
new THREE.MeshStandardMaterial({color:0xe6eeee,transparent:true,opacity:.6}));
glass.position.set(3,.3,-3);scene.add(glass);
const tea=new THREE.Mesh(
new THREE.CylinderGeometry(.13,.1,.2,12),
new THREE.MeshStandardMaterial({color:0xc66a19}));
tea.position.set(3,.28,-3);scene.add(tea);

// Hareket ve kamera
const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let yaw=0,pitch=.25,drag=false,lx=0,ly=0;

renderer.domElement.addEventListener('pointerdown',e=>{
drag=true;lx=e.clientX;ly=e.clientY;
});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{
if(!drag)return;
yaw-=(e.clientX-lx)*.005;
pitch=Math.max(-.1,Math.min(1,(pitch+(e.clientY-ly)*.005)));
lx=e.clientX;ly=e.clientY;
});

function animate(){
requestAnimationFrame(animate);
const f=(keys.w?1:0)-(keys.s?1:0);
const r=(keys.d?1:0)-(keys.a?1:0);
player.position.x+=(Math.sin(yaw)*f+Math.cos(yaw)*r)*.09;
player.position.z+=(Math.cos(yaw)*f-Math.sin(yaw)*r)*.09;

const t=player.position;
camera.position.set(
t.x-Math.sin(yaw)*8,
t.y+4+pitch*2,
t.z-Math.cos(yaw)*8
);
camera.lookAt(t.x,t.y+1.2,t.z);
renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
