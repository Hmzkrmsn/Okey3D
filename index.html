<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Okey 3D Kafe</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#182536}
#ui,#help{position:fixed;top:12px;background:#182536ee;color:#fff;padding:12px;border-radius:10px;z-index:5;font-size:13px;line-height:1.6}
#ui{left:12px}#help{right:12px;text-align:right}
#tip{color:#9ed5ff}
#game{position:fixed;bottom:0;left:0;width:100%;background:linear-gradient(transparent,#101923 25%);padding:35px 12px 12px;z-index:5;color:#fff}
#tiles{display:flex;gap:5px;overflow-x:auto;justify-content:center;padding:14px 8px 6px}
.tile{flex:0 0 38px;height:56px;background:#f5edda;border:2px solid #c8bda5;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:bold;cursor:pointer;box-shadow:0 3px 5px #0008}
.tile.okey{border-color:#e6a400;background:#fff3c4}
.tile.selected{transform:translateY(-12px);border:3px solid #42baff}
#buttons{text-align:center;margin-top:6px}
button{border:0;border-radius:8px;padding:10px 14px;margin:3px;background:#287ac0;color:#fff;font-weight:bold;cursor:pointer;font-size:14px}
button:disabled{opacity:.35;cursor:default}
#tea{background:#b8561a}
#status{text-align:center;font-size:14px;color:#d6eaff}
#lobby{position:fixed;inset:0;z-index:10;background:#182536f2;display:flex;align-items:center;justify-content:center;color:#fff}
.box{width:min(360px,92vw);text-align:center}
.box input{padding:10px;border-radius:8px;border:0;margin:4px;width:150px;font-size:15px}
#lobby .look{margin:6px 0 10px;font-size:14px}
.box input[type=color]{width:44px;height:32px;padding:0;margin:4px;border-radius:6px;vertical-align:middle}
#lt{margin:12px 0;color:#9ed5ff;min-height:20px;white-space:pre-line}
</style>
</head>
<body>
<div id="lobby"><div class="box">
<h2>Okey 3D Kafe</h2>
<input id="nm" placeholder="Adın" maxlength="12"><br>
<div class="look">Gömlek <input type="color" id="cs" value="#2585dc"> Saç <input type="color" id="ch" value="#2b1b12"> Ten <input type="color" id="ck" value="#ffc38e"></div>
<button id="solo">Tek başına (botlarla)</button>
<button id="mk">Oda kur</button><br>
<input id="cd" placeholder="Oda kodu" maxlength="4">
<button id="jn">Odaya katıl</button>
<div id="lt"></div>
<button id="go" hidden>Oyunu başlat</button>
</div></div>

<div id="ui"><b>OKEY 3D KAFE</b><br>Fare sürükle: etrafa bak<br>E: Otur / Kalk · WASD: yürü<br><span id="tip"></span></div>
<div id="help"><b>101 OKEY</b><br>Oyun başlayınca gösterge burada.</div>

<div id="game">
<div id="status">Bir oyun başlat veya odaya katıl.</div>
<div id="buttons">
<button id="dp" disabled>Desteden çek</button>
<button id="dd" disabled>Soldan al</button>
<button id="ds" disabled>Taş at</button>
<button id="sd">Seri diz</button>
<button id="cf">Çift diz</button>
<button id="gr" disabled>Grupla</button>
<button id="op" disabled>Aç</button>
<button id="cl">Temizle</button>
<button id="sit">Otur / Kalk (E)</button>
<button id="tea">☕ Çay iste</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id);
const msg=t=>$('status').textContent=t;
const TC=['#d83b36','#2679c9','#259b5a','#292929'];
const CN=['kırmızı','mavi','yeşil','siyah'];

/* ---------- SAHNE ---------- */
const scene=new THREE.Scene();scene.background=new THREE.Color(0x1b130e);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffe6c4,0x2a1c12,.8));
const sun=new THREE.PointLight(0xffd9a0,150,40,2);sun.position.set(0,5.9,0);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
for(const[x,z]of[[-8.5,-5],[8.5,-5],[-8.5,5],[8.5,5]]){const l=new THREE.PointLight(0xffc27a,45,18,2);l.position.set(x,5.8,z);scene.add(l)}
function cube(w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c}));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}

cube(26,1,26,0x6a4a30,0,-.5,0);cube(26,9,1,0xe6d5b9,0,4.5,12);cube(26,.4,26,0x3b2a1e,0,9.2,0);cube(50,9,1,0xe6d5b9,0,4.5,-12);
cube(1,9,25,0xcdbb9f,-12,4.5,0);cube(1,9,25,0xcdbb9f,12,4.5,0);
for(const x of[-4,4]){const w=cube(5,3,.15,0x3b6f94,x,4,-11.4);w.material.emissive.set(0x1c4a6e)}
cube(5,.3,4,0x2f6b45,0,1.5,0);
for(const x of[-2,2])for(const z of[-1.5,1.5])cube(.25,1.5,.25,0x493020,x,.75,z);
const A=i=>i*Math.PI/2;
const L2W=(s,x,z)=>{const a=A(s);return [x*Math.cos(a)+z*Math.sin(a),-x*Math.sin(a)+z*Math.cos(a)]};
const seatPos=i=>({x:Math.sin(A(i))*3.5,z:Math.cos(A(i))*3});
for(let i=0;i<4;i++){const g=new THREE.Group(),p=seatPos(i);g.position.set(p.x,0,p.z);g.rotation.y=A(i);scene.add(g);
 const add=(x,y,z,sx,sy,sz,c)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),new THREE.MeshStandardMaterial({color:c}));m.position.set(x,y,z);m.castShadow=true;g.add(m)};
 add(0,.85,0,1,.15,1,0x9a6238);add(0,1.5,.46,1,1.1,.12,0x80502c);
 for(const x of[-.4,.4])for(const z of[-.4,.4])add(x,.4,z,.1,.8,.1,0x493020)}
for(const p of[[-8.5,-5],[8.5,-5],[-8.5,5],[8.5,5]]){cube(3,.3,2,0x75472b,p[0],1.5,p[1]);for(const x of[-1,1])for(const z of[-.6,.6])cube(.2,1.5,.2,0x493020,p[0]+x,.75,p[1]+z)}
function lamp(x,z,y,r){const m=new THREE.MeshStandardMaterial({color:0xffd27a,emissive:0xffb347,emissiveIntensity:1.2,side:THREE.DoubleSide});
 const cord=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,9-y,6),new THREE.MeshStandardMaterial({color:0x111111}));cord.position.set(x,(9+y)/2,z);scene.add(cord);
 const sh=new THREE.Mesh(new THREE.ConeGeometry(r,r*.7,20,1,true),m);sh.position.set(x,y,z);scene.add(sh);
 const bulb=new THREE.Mesh(new THREE.SphereGeometry(r*.25,12,8),new THREE.MeshBasicMaterial({color:0xfff2c8}));bulb.position.set(x,y-r*.2,z);scene.add(bulb)}
lamp(0,0,6.3,1.1);for(const[x,z]of[[-8.5,-5],[8.5,-5],[-8.5,5],[8.5,5]])lamp(x,z,6.5,.7);
cube(5,1.3,1.5,0x68442b,0,.65,-9);cube(5.2,.15,1.7,0x3e281b,0,1.35,-9);

// deste yığını ve atılan taşlar

const discMesh=[0,1,2,3].map(i=>{const a=A(i),cm=()=>new THREE.MeshStandardMaterial({color:0xf5edda});
 const m=new THREE.Mesh(new THREE.BoxGeometry(.34,.07,.46),[cm(),cm(),cm(),cm(),cm(),cm()]);
 {const w=L2W(i,1.5,1.4);m.position.set(w[0],1.7,w[1])}m.rotation.y=a;m.castShadow=true;m.visible=false;scene.add(m);return m});

function makeTea(){const g=new THREE.Group();
g.add(new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.02,16),new THREE.MeshStandardMaterial({color:0xffffff})));
const gl=new THREE.Mesh(new THREE.CylinderGeometry(.13,.09,.26,12),new THREE.MeshStandardMaterial({color:0xe6eeee,transparent:true,opacity:.55}));gl.position.y=.14;g.add(gl);
const t=new THREE.Mesh(new THREE.CylinderGeometry(.115,.085,.18,12),new THREE.MeshStandardMaterial({color:0xc0451a}));t.position.y=.12;g.add(t);g.userData.liq=t;
 const h=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.5,8),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));h.position.y=.2;g.add(h);
 g.scale.setScalar(.6);return g}

const dark=new THREE.MeshStandardMaterial({color:0x252b35});
const blk=new THREE.MeshStandardMaterial({color:0x151515}),lip=new THREE.MeshStandardMaterial({color:0xb5483f});
function person(col,hc=0x2b1b12,sk=0xffc38e){const p=new THREE.Group(),sh=new THREE.MeshStandardMaterial({color:col}),hm=new THREE.MeshStandardMaterial({color:hc}),skin=new THREE.MeshStandardMaterial({color:sk});
 const add=(g,m,x,y,z)=>{m.position.set(x,y,z);m.castShadow=true;g.add(m);return m};
 add(p,new THREE.Mesh(new THREE.CylinderGeometry(.35,.45,1.1,6),sh),0,1.25,0);
 add(p,new THREE.Mesh(new THREE.IcosahedronGeometry(.4,1),skin),0,2.1,0);
 add(p,new THREE.Mesh(new THREE.SphereGeometry(.44,16,12,0,Math.PI*2,0,Math.PI*.5),hm),0,2.17,-.03);
 add(p,new THREE.Mesh(new THREE.BoxGeometry(.5,.1,.12),hm),0,2.36,.33);
 for(const x of[-.14,.14])add(p,new THREE.Mesh(new THREE.SphereGeometry(.05,8,8),blk),x,2.13,.36);
 add(p,new THREE.Mesh(new THREE.BoxGeometry(.07,.1,.07),skin),0,2.04,.41);
 add(p,new THREE.Mesh(new THREE.BoxGeometry(.15,.035,.04),lip),0,1.93,.37);
 const l=[],a=[];
 for(const x of[-.22,.22]){const g=new THREE.Group();g.position.set(x,.8,0);add(g,new THREE.Mesh(new THREE.BoxGeometry(.2,.8,.2),dark),0,-.4,0);p.add(g);l.push(g)}
 for(const x of[-.45,.45]){const g=new THREE.Group();g.position.set(x,1.75,0);add(g,new THREE.Mesh(new THREE.BoxGeometry(.2,.85,.2),skin),0,-.42,0);p.add(g);a.push(g)}
 p.userData={l,a,m:{sh,hm,skin}};scene.add(p);return p}
function setLook(p,l){if(!l)return;const m=p.userData.m;m.sh.color.set(l.s);m.hm.color.set(l.h);m.skin.color.set(l.k)}
function walk(p,moving){const u=p.userData,s=moving?Math.sin(performance.now()*.012)*.7:0,k=.3;
 u.l[0].rotation.x+=(s-u.l[0].rotation.x)*k;u.l[1].rotation.x+=(-s-u.l[1].rotation.x)*k;
 u.a[0].rotation.x+=(-s-u.a[0].rotation.x)*k;u.a[1].rotation.x+=(s-u.a[1].rotation.x)*k}

const player=person(0x2585dc);player.position.set(0,0,6);
const hairC=[0x2b1b12,0xc8a24a,0x111111,0x6b3a1e];
const avatars=[0xd9534f,0x5cb85c,0xf0ad4e,0x9b59b6].map((c,i)=>{const p=person(c,hairC[i]),s=seatPos(i);
 p.position.set(s.x,.15,s.z);p.rotation.y=A(i)+Math.PI;p.visible=false;
 p.userData.l.forEach(g=>g.rotation.x=-1.45);p.userData.a.forEach(g=>g.rotation.x=-.7);return p});

/* ---------- GARSON ---------- */
const waiter=person(0xf2f2f2),HOME=new THREE.Vector3(0,0,-10.2);waiter.position.copy(HOME);
const tray=makeTea();tray.position.set(.2,1.2,.6);tray.visible=false;waiter.add(tray);
let wState='idle',wp=[],backPts=[],teas=[],teaQ=[],cur=0;const slotN=[0,0,0,0];
function startTea(s){teaQ.push(s);if(s===me)msg('Garson: "Hemen getiriyorum!"');else if(view)msg(view.names[s]+' çay istedi.');if(wState==='idle')nextTea()}
function nextTea(){if(!teaQ.length)return;cur=teaQ.shift();
 const p=seatPos(cur),tx=p.x+(cur%2===0?1.4:0),tz=p.z+(cur%2===1?1.4:0),side=tx>=0?5.4:-5.4;
 const v=(x,z)=>new THREE.Vector3(x,0,z),sx=side>0?4.4:-4.4,pts=[v(sx,-10.2),v(side,-8),v(side,tz),v(tx,tz)];
 wp=pts;backPts=pts.slice(0,-1).reverse().concat(HOME.clone());wState='going';tray.visible=true}
function placeTea(){const s=cur,a=A(s),slot=slotN[s]++%4,k=slot*.38,d=s%2===0?1.75:2.25,q=s%2===0?2:1.6,t=makeTea();
 for(let i=teas.length-1;i>=0;i--)if(teas[i].userData.seat===s&&teas[i].userData.slot===slot){scene.remove(teas[i]);teas.splice(i,1)}
 const w=L2W(s,-1.5-(slot%2)*.38,1.6-(slot>>1)*.45);t.position.set(w[0],1.66,w[1]);
 t.userData.base=1.66;t.userData.seat=s;t.userData.slot=slot;scene.add(t);teas.push(t);tray.visible=false}
function drink(g){const u=g.userData;if(u.sip)return;if(u.empty){msg('Bardak boş, yeni çay isteyebilirsin.');return}net({t:'sip',slot:u.slot})}
function onNet(m){if(m.t==='tea')startTea(m.seat);
 else if(m.t==='sip'){const g=teas.find(x=>x.userData.seat===m.seat&&x.userData.slot===m.slot);
  if(g&&!g.userData.sip&&!g.userData.empty){g.userData.sip=performance.now();if(m.seat===me)msg('Çayı yudumluyorsun... ☕')}}}
const bcast=m=>{conns.forEach(c=>c&&c.send(m));onNet(m)};
function net(m){if(isHost){m.seat=Math.max(me,0);bcast(m)}else if(conn)conn.send(m);else onNet({...m,seat:0})}
function updateTeas(){const now=performance.now();
 for(const g of teas){const u=g.userData;if(!u.sip)continue;const e=(now-u.sip)/1500;
  if(e>=1){u.sip=0;u.empty=true;u.liq.visible=false;g.position.y=u.base;if(u.seat===me)msg('Afiyet olsun, çayın bitti!');continue}
  g.position.y=u.base+Math.sin(Math.PI*e)*.45;const sc=Math.max(.02,1-e);u.liq.scale.y=sc;u.liq.position.y=.03+.09*sc}}
function updateWaiter(){
 if(wState==='idle')return;
 const t=wp[0],dx=t.x-waiter.position.x,dz=t.z-waiter.position.z,d=Math.hypot(dx,dz);
 if(d<.1){wp.shift();if(!wp.length){
  if(wState==='going'){placeTea();if(cur===me)msg('Çayın geldi! İçmek için bardağa tıkla ☕');wState='back';wp=backPts}
  else{wState='idle';waiter.rotation.y=0;waiter.position.y=0;nextTea()}}return}
 waiter.position.x+=dx/d*.07;waiter.position.z+=dz/d*.07;waiter.rotation.y=Math.atan2(dx,dz);
 waiter.position.y=Math.abs(Math.sin(performance.now()*.012))*.06;
}
$('tea').onclick=()=>net({t:'tea'});

/* ---------- OYUN MANTIĞI (sunucu = oda kuran) ---------- */
let G=null,L={type:['human','empty','empty','empty'],names:['','','',''],look:[null,null,null,null]},conns=[],peer=null,conn=null,isHost=false;
let me=-1,view=null,hand=[],chosen=new Set(),pend=[],started=false,okey=null;
const DEF=[{s:'#d9534f',h:'#2b1b12',k:'#ffc38e'},{s:'#5cb85c',h:'#c8a24a',k:'#e8b48a'},{s:'#f0ad4e',h:'#111111',k:'#c68a5e'},{s:'#9b59b6',h:'#6b3a1e',k:'#ffd5b0'}];
const cl=v=>/^#[0-9a-f]{6}$/i.test(v)?v:'#888888';
const myLook=()=>({s:$('cs').value,h:$('ch').value,k:$('ck').value});
const isW=t=>t.n>0&&okey&&t.n===okey.n&&t.c===okey.c;
const eff=t=>t.n===0?{n:okey.n,c:okey.c}:t;
function grp(ts){
 const w=ts.filter(isW).length,r=ts.filter(t=>!isW(t)).map(eff),L=ts.length;
 if(L<3||!r.length)return 0;
 if(L<=4&&r.every(t=>t.n===r[0].n)&&new Set(r.map(t=>t.c)).size===r.length)return r[0].n*L;
 if(L<=13&&r.every(t=>t.c===r[0].c)){
  for(const hi of[0,1]){
   const ns=r.map(t=>t.n===1&&hi?14:t.n).sort((a,b)=>a-b);
   if(new Set(ns).size<ns.length)continue;
   const gap=ns[ns.length-1]-ns[0]+1-ns.length;if(gap>w)continue;
   const ext=w-gap,lo=ns[0]-Math.min(ext,ns[0]-1),top=lo+L-1;if(top>14)continue;
   let sum=0;for(let v=lo;v<=top;v++)sum+=v===14?1:v;return sum}}
 return 0}
const isPair=ts=>ts.length===2&&(isW(ts[0])||isW(ts[1])||(eff(ts[0]).n===eff(ts[1]).n&&eff(ts[0]).c===eff(ts[1]).c));
function finish(w){G.over=true;G.win=w;
 G.res=[0,1,2,3].map(i=>{if(i===w)return G.names[i]+': BİTİRDİ 🎉';
  const sum=G.hands[i].reduce((a,t)=>a+(isW(t)?30:eff(t).n),0);return G.names[i]+': '+(G.omode[i]?sum:202)+' ceza'})}
function doOpen(s,m){const h=G.hands[s],gs=m.groups;if(!Array.isArray(gs)||!gs.length)return false;
 const seen=new Set(),tg=[];
 for(const g of gs){if(!Array.isArray(g))return false;const ts=[];for(const id of g){const t=h.find(x=>x.id===id);if(!t||seen.has(id))return false;seen.add(id);ts.push(t)}tg.push(ts)}
 const pair=tg.every(g=>g.length===2),run=tg.every(g=>g.length>=3);if(!pair&&!run)return false;
 const mode=pair?2:1;if(G.omode[s]&&G.omode[s]!==mode)return false;
 let pts=0;for(const g of tg){if(pair){if(!isPair(g))return false}else{const q=grp(g);if(!q)return false;pts+=q}}
 if(!G.omode[s]&&(pair?tg.length<5:pts<101))return false;
 G.omode[s]=mode;for(const g of tg){g.forEach(t=>h.splice(h.indexOf(t),1));G.melds[s].push(g)}
 if(!h.length)finish(s);return true}
function doAdd(s,m){if(G.omode[s]!==1)return false;const h=G.hands[s],ml=G.melds[m.seat]&&G.melds[m.seat][m.mi],t=h.find(x=>x.id===m.id);if(!ml||!t)return false;
 const nm=[[...ml,t],[t,...ml]].find(c=>grp(c)>0);if(!nm)return false;
 G.melds[m.seat][m.mi]=nm;h.splice(h.indexOf(t),1);if(!h.length)finish(s);return true}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function newGame(){
 let d=[],id=0;for(let k=0;k<2;k++)for(let c=0;c<4;c++)for(let n=1;n<=13;n++)d.push({id:id++,n,c});
 d.push({id:id++,n:0,c:0},{id:id++,n:0,c:1});shuffle(d);
 let k=d.findIndex(t=>t.n>0);const ind=d.splice(k,1)[0];
 const hands=[0,1,2,3].map(i=>d.splice(0,i===0?22:21));
 G={look:L.look.map((l,i)=>l||DEF[i]),type:L.type.map(t=>t==='empty'?'bot':t),names:L.names.map((n,i)=>n||'Bot '+(i+1)),hands,pile:d,disc:[[],[],[],[]],turn:0,ind,over:false,drawn:true,omode:[0,0,0,0],melds:[[],[],[],[]],res:null};okey={n:ind.n%13+1,c:ind.c};
}
const mk=i=>({t:'st',seat:i,look:G.look,drawn:G.drawn,melds:G.melds,omode:G.omode,res:G.res,hand:G.hands[i],cnt:G.hands.map(h=>h.length),pile:G.pile.length,top:G.disc.map(x=>x[x.length-1]||null),turn:G.turn,ind:G.ind,names:G.names,type:G.type,over:G.over});
function sendAll(){for(let i=0;i<4;i++){if(G.type[i]!=='human')continue;if(i===0)apply(mk(0));else if(conns[i])conns[i].send(mk(i))}}
function act(s,m){
 if(!G||G.over||s!==G.turn)return;const h=G.hands[s];
 if(m.t==='draw'){if(G.drawn)return;
  if(m.src==='disc'){const p=(s+3)%4;if(!G.disc[p].length)return;h.push(G.disc[p].pop())}
  else{if(!G.pile.length){finish(-1);sendAll();return}h.push(G.pile.pop())}
  G.drawn=true}
 else if(!G.drawn)return;
 else if(m.t==='discard'){const k=h.findIndex(t=>t.id===m.id);if(k<0)return;G.disc[s].push(h.splice(k,1)[0]);G.turn=(s+1)%4;G.drawn=false;if(!h.length)finish(s)}
 else if(m.t==='open'){if(!doOpen(s,m))return}
 else if(m.t==='add'){if(!doAdd(s,m))return}
 else return;
 sendAll();botTick();
}
function botTick(){
 if(!G||G.over||G.type[G.turn]!=='bot')return;
 setTimeout(()=>{const s=G.turn;if(G.type[s]!=='bot')return;act(s,{t:'draw',src:'pile'});
  setTimeout(()=>{const h=G.hands[s];if(G.drawn&&G.turn===s&&h.length)act(s,{t:'discard',id:h[Math.random()*h.length|0].id})},900)},1300);
}
const send=m=>isHost?act(0,m):conn&&conn.send(m);

/* ---------- ARAYÜZ ---------- */
const tl=t=>t.n||'★';
const wood=new THREE.MeshStandardMaterial({color:0x6b4426}),wood2=new THREE.MeshStandardMaterial({color:0x4a2e18});
const racks=[0,1,2,3].map(i=>{const g=new THREE.Group(),a=A(i),d=i%2===0?1.55:2.05;
 g.position.set(Math.sin(a)*d,1.65,Math.cos(a)*d);g.rotation.y=a;scene.add(g);
 const part=(w,h,dp,x,y,z,m)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,dp),m);b.position.set(x,y,z);b.castShadow=true;g.add(b)};
 part(2.1,.1,.34,0,.05,.15,wood);
 part(2.1,.22,.34,0,.11,-.17,wood);
 part(2.1,.5,.06,0,.25,-.37,wood2);
 part(.08,.5,.8,-1.04,.25,-.03,wood2);part(.08,.5,.8,1.04,.25,-.03,wood2);
 g.userData.s=g.children.length;return g});
const texC={};
function tex(t,gold){const k=t.n+'_'+t.c+gold;if(texC[k])return texC[k];
 const c=document.createElement('canvas');c.width=64;c.height=96;const x=c.getContext('2d');
 x.fillStyle=gold?'#fff3c4':'#f5edda';x.fillRect(0,0,64,96);
 x.strokeStyle='#c8bda5';x.lineWidth=4;x.strokeRect(2,2,60,92);
 x.fillStyle=TC[t.c];x.font='bold 54px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(t.n||'★',32,50);
 const T=new THREE.CanvasTexture(c);T.colorSpace=THREE.SRGBColorSpace;return texC[k]=T}
const backMat=new THREE.MeshStandardMaterial({color:0xe0cfa0});
let myTiles=[];
function fillRack(i,items){
 const g=racks[i];for(let k=g.children.length-1;k>=g.userData.s;k--)g.remove(g.children[k]);
 items.forEach((t,k)=>{
  const row=k<11?0:1,c=row?k-11:k,sel=t&&chosen.has(t.id),pd=t&&pend.some(g=>g.includes(t.id));
  const mats=t?[0,1,2,3,4,5].map(f=>f===4?new THREE.MeshStandardMaterial({map:tex(t,isW(t)||t.n===0),emissive:pd?0x2a6aa8:0x000000}):backMat):backMat;
  const m=new THREE.Mesh(new THREE.BoxGeometry(.14,.22,.06),mats);
  m.position.set((c-5)*.165,(row?.33:.21)+(sel?.1:0),(row?-.15:.17)+(sel?.06:0));m.rotation.x=-.25;m.castShadow=true;
  if(t){m.userData.id=t.id;myTiles.push(m)}
  g.add(m)});
}
// ortadaki deste ve gösterge
const cen=new THREE.Group();cen.position.y=1.65;scene.add(cen);
const tgeo=new THREE.BoxGeometry(.18,.06,.27),bgeo=new THREE.BoxGeometry(.18,.02,.27);
const tmC=new THREE.MeshStandardMaterial({color:0xf1e6c8}),tmB=new THREE.MeshStandardMaterial({color:0xc9672b});
function buildCenter(st){
 while(cen.children.length)cen.remove(cen.children[0]);
 for(let k=0;k<st.pile;k++){const sk=k>>1,lv=k&1,col=sk%5,row=sk/5|0,y=lv*.085;
  const g=new THREE.Group();g.position.set((col-2)*.22,y,(row-.5)*.31-.1);g.rotation.y=Math.sin(k*7.3)*.06;
  const b=new THREE.Mesh(bgeo,tmB);b.position.y=.01;const t=new THREE.Mesh(tgeo,tmC);t.position.y=.05;t.castShadow=true;
  g.add(b,t);cen.add(g)}
 const ig=new THREE.Group();ig.position.set(-1.7,0,.1);
 const plate=new THREE.Mesh(new THREE.BoxGeometry(.32,.02,.44),new THREE.MeshStandardMaterial({color:0xd9a400}));plate.position.y=.01;ig.add(plate);
 const ti=new THREE.Mesh(new THREE.BoxGeometry(.2,.05,.3),[tmC,tmC,new THREE.MeshStandardMaterial({map:tex(st.ind,false)}),tmC,tmC,tmC]);
 ti.position.y=.045;ti.castShadow=true;ig.add(ti);cen.add(ig);
 cen.rotation.y=A(me);
}
const meldG=new THREE.Group();scene.add(meldG);let meldTiles=[];const mgeo=new THREE.BoxGeometry(.15,.025,.21);
function buildMelds(st){
 while(meldG.children.length)meldG.remove(meldG.children[0]);meldTiles=[];
 for(let i=0;i<4;i++){let x=-1,r=0;(st.melds[i]||[]).forEach((g,mi)=>{
  if(x+g.length*.16>1.05&&x>-1){x=-1;r++}
  g.forEach(t=>{const w=L2W(i,x+.08,.95-r*.3);
   const m=new THREE.Mesh(mgeo,[tmC,tmC,new THREE.MeshStandardMaterial({map:tex(t,isW(t)||t.n===0)}),tmC,tmC,tmC]);
   m.position.set(w[0],1.67,w[1]);m.rotation.y=A(i);m.userData={seat:i,mi};m.castShadow=true;meldG.add(m);meldTiles.push(m);x+=.16});x+=.1})}
}
function renderHand(){
 myTiles=[];fillRack(me,hand);
 for(let i=0;i<4;i++)if(i!==me)fillRack(i,Array(view.cnt[i]).fill(null));
}
function buttons(){
 if(!view)return;const my=view.turn===me&&!view.over,dr=view.drawn,prev=view.top[(me+3)%4];
 $('dp').disabled=!(my&&!dr);$('dd').disabled=!(my&&!dr&&prev);
 $('dd').innerHTML='Soldan al'+(prev?` (<span style="color:${prev.n?TC[prev.c]==='#292929'?'#fff':TC[prev.c]:'#fff'}">${tl(prev)} ${CN[prev.c]}</span>)`:'');
 $('ds').disabled=!(my&&dr&&chosen.size===1);$('gr').disabled=!(my&&dr&&chosen.size>=2);$('op').disabled=!(my&&dr&&pend.length>0);
 const pr=pend.every(g=>g.length===2);let pts=0;if(!pr)pend.forEach(g=>pts+=grp(g.map(id=>hand.find(t=>t.id===id))));
 const info=pend.length?' | '+pend.length+(pr?' çift':' grup, '+pts+' puan')+(view.omode[me]?'':pr?' (açmak için 5 çift)':' (açmak için 101)'):'';
 msg(view.over?(view.res||['Oyun bitti']).join('  |  '):my?(dr?'Sıra sende: grupla/aç ya da bir taş at.'+info:'Sıra sende: taş çek.'):'Sıra: '+view.names[view.turn]);
}
function apply(st){
 view=st;me=st.seat;const ids=new Set(st.hand.map(t=>t.id));
 hand=hand.filter(t=>ids.has(t.id)).concat(st.hand.filter(t=>!hand.some(h=>h.id===t.id)));
 for(const id of[...chosen])if(!ids.has(id))chosen.delete(id);pend=pend.filter(g=>g.every(id=>ids.has(id)));
 okey={n:st.ind.n%13+1,c:st.ind.c};
 setLook(player,st.look[me]);buildMelds(st);for(let i=0;i<4;i++)if(i!==me)setLook(avatars[i],st.look[i]);
 $('help').innerHTML=`<b>101 OKEY</b><br>Gösterge: <b style="color:${TC[st.ind.c]==='#292929'?'#fff':TC[st.ind.c]}">${st.ind.n} ${CN[st.ind.c]}</b><br>Okey: <b>${okey.n} ${CN[okey.c]}</b><br>Destede ${st.pile} taş`;
 if(!started){started=true;$('lobby').style.display='none';sit(true)}
 buildCenter(st);
 for(let i=0;i<4;i++){const t=st.top[i];discMesh[i].visible=!!t;if(t)discMesh[i].material[2]=new THREE.MeshStandardMaterial({map:tex(t,(okey&&t.n===okey.n&&t.c===okey.c)||t.n===0)});
  avatars[i].visible=st.type[i]!=='empty'&&i!==me}
 renderHand();buttons();
}
$('dp').onclick=()=>send({t:'draw',src:'pile'});
$('dd').onclick=()=>send({t:'draw',src:'disc'});
$('ds').onclick=()=>{if(chosen.size===1){send({t:'discard',id:[...chosen][0]});chosen.clear()}};
$('gr').onclick=()=>{const ts=hand.filter(t=>chosen.has(t.id));
 if(!(ts.length===2?isPair(ts):grp(ts)>0)){msg('Bu taşlar geçerli bir per, seri ya da çift değil.');return}
 pend.push(ts.map(t=>t.id));chosen.clear();renderHand();buttons()};
$('op').onclick=()=>{send({t:'open',groups:pend});pend=[];renderHand()};
$('cl').onclick=()=>{pend=[];chosen.clear();renderHand();buttons()};
$('sd').onclick=()=>{if(!okey)return;let rest=[...hand],out=[];const take=g=>{g.forEach(t=>rest.splice(rest.indexOf(t),1));out.push(...g)};
 for(let c=0;c<4;c++){const ts=rest.filter(t=>!isW(t)&&eff(t).c===c).sort((a,b)=>eff(a).n-eff(b).n);let run=[];
  const fl=()=>{if(run.length>=3)take(run);run=[]};
  for(const t of ts){const n=eff(t).n;if(run.length&&n===eff(run[run.length-1]).n)continue;if(run.length&&n!==eff(run[run.length-1]).n+1)fl();run.push(t)}fl()}
 for(let n=1;n<=13;n++){const seen=new Set(),u=rest.filter(t=>!isW(t)&&eff(t).n===n&&!seen.has(eff(t).c)&&seen.add(eff(t).c));if(u.length>=3)take(u)}
 rest.sort((a,b)=>(isW(a)-isW(b))||eff(a).c-eff(b).c||eff(a).n-eff(b).n);hand=[...out,...rest];renderHand()};
$('cf').onclick=()=>{if(!okey)return;let rest=[...hand].sort((a,b)=>eff(a).c-eff(b).c||eff(a).n-eff(b).n),out=[];
 for(let i=0;i<rest.length-1;){const a=rest[i],b=rest[i+1];if(!isW(a)&&!isW(b)&&eff(a).n===eff(b).n&&eff(a).c===eff(b).c){out.push(a,b);rest.splice(i,2)}else i++}
 hand=[...out,...rest];renderHand()};

/* ---------- OTURMA ve KAMERA ---------- */
let seated=false,yaw=Math.PI,pitch=.25,offY=0,offP=0;
function sit(on){
 if(on&&me<0){msg('Önce bir oyun başlat.');return}
 seated=on;player.visible=!on;const s=seatPos(Math.max(me,0));
 if(on){player.position.set(s.x,0,s.z);offY=offP=0;$('tip').textContent='Masadasın.'}
 else{player.position.set(s.x*1.5,0,s.z*1.5);yaw=A(me)+Math.PI;$('tip').textContent='Kafede geziyorsun.'}
}
function sitToggle(){
 if(me<0){msg('Önce bir oyun başlat.');return}
 if(!seated&&player.position.distanceTo(new THREE.Vector3(0,0,0))>7){msg('Oturmak için masaya yaklaş!');return}
 sit(!seated);
}
$('sit').onclick=sitToggle;
const keys={};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();keys[k]=true;if(k==='e'&&!e.repeat)sitToggle()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let drag=false,lx=0,ly=0;
let sx=0,sy=0;const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=sx=e.clientX;ly=sy=e.clientY});
addEventListener('pointerup',e=>{drag=false;if(Math.hypot(e.clientX-sx,e.clientY-sy)<6&&e.target===renderer.domElement)pick(e)});
function pick(e){if(!seated||!view)return;mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,camera);
 const c=[['t',ray.intersectObjects(myTiles)[0]],['c',ray.intersectObjects(teas.filter(x=>x.userData.seat===me),true)[0]],['m',ray.intersectObjects(meldTiles)[0]]].filter(x=>x[1]).sort((a,b)=>a[1].distance-b[1].distance)[0];
 if(!c)return;const o=c[1].object;
 if(c[0]==='c'){let g=o;while(g&&!teas.includes(g))g=g.parent;if(g)drink(g)}
 else if(c[0]==='m'){if(chosen.size===1&&view.turn===me&&view.drawn){send({t:'add',id:[...chosen][0],seat:o.userData.seat,mi:o.userData.mi});chosen.clear();renderHand();buttons()}else msg('İşlemek için önce elinden tek bir taş seç.')}
 else{const id=o.userData.id;chosen.has(id)?chosen.delete(id):chosen.add(id);renderHand();buttons()}}
addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
 if(seated){offY=Math.max(-1.1,Math.min(1.1,offY-dx*.004));offP=Math.max(-.5,Math.min(.5,offP-dy*.004))}
 else{yaw-=dx*.005;pitch=Math.max(-.1,Math.min(1,pitch+dy*.005))}});

const look=new THREE.Vector3();
function animate(){
 requestAnimationFrame(animate);
 if(!seated){
  const f=(keys.w?1:0)-(keys.s?1:0),r=(keys.a?1:0)-(keys.d?1:0);
  const vx=(Math.sin(yaw)*f+Math.cos(yaw)*r)*.09,vz=(Math.cos(yaw)*f-Math.sin(yaw)*r)*.09;
  player.position.x=Math.max(-10,Math.min(10,player.position.x+vx));
  player.position.z=Math.max(-10,Math.min(10,player.position.z+vz));
  if(f||r)player.rotation.y=Math.atan2(vx,vz);
  walk(player,!!(f||r));
  const t=player.position;
  camera.position.lerp(new THREE.Vector3(t.x-Math.sin(yaw)*8,4+pitch*2,t.z-Math.cos(yaw)*8),.12);
  camera.lookAt(t.x,t.y+1.2,t.z);
 }else{
  const a=A(me),ey=a+Math.PI+offY,p=-.6+offP;
  camera.position.lerp(new THREE.Vector3(Math.sin(a)*4.3,3.2,Math.cos(a)*3.7),.15);
  look.set(camera.position.x+Math.sin(ey)*Math.cos(p),camera.position.y+Math.sin(p),camera.position.z+Math.cos(ey)*Math.cos(p));
  camera.lookAt(look);
 }
 updateWaiter();updateTeas();walk(waiter,wState!=='idle');renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

/* ---------- LOBİ ve ÇEVRİMİÇİ ---------- */
const nm=()=>($('nm').value.trim()||'Oyuncu');
const lobbyTxt=()=>L.names.map((n,i)=>`${i+1}. ${L.type[i]==='empty'?'(boş, bot olacak)':n}`).join('\n');
function lobbyBroadcast(){$('lt').textContent='Oda kodu: '+code+'\n'+lobbyTxt();conns.forEach(c=>c&&c.send({t:'lobby',txt:'Oda kodu: '+code+'\n'+lobbyTxt()}))}
let code='';
$('solo').onclick=()=>{isHost=true;me=0;L.names[0]=nm();L.look[0]=myLook();newGame();sendAll();botTick()};
$('mk').onclick=()=>{
 if(!window.Peer){$('lt').textContent='PeerJS yüklenemedi, internetini kontrol et.';return}
 isHost=true;me=0;L.names[0]=nm();L.look[0]=myLook();code=Math.random().toString(36).slice(2,6).toUpperCase();
 $('lt').textContent='Oda kuruluyor...';
 peer=new Peer('okey3d-'+code);
 peer.on('error',e=>$('lt').textContent='Bağlantı hatası: '+e.type);
 peer.on('open',()=>{lobbyBroadcast();$('go').hidden=false});
 peer.on('connection',c=>{
  c.on('data',d=>{
   if(d.t==='join'){const s=L.type.indexOf('empty');if(G||s<0){c.send({t:'full'});return}
    L.type[s]='human';L.names[s]=d.name;L.look[s]=d.look?{s:cl(d.look.s),h:cl(d.look.h),k:cl(d.look.k)}:null;conns[s]=c;c._s=s;c.send({t:'seat',seat:s});lobbyBroadcast()}
   else if(d.t==='tea'||d.t==='sip'){d.seat=c._s;bcast(d)}else act(c._s,d)});
  c.on('close',()=>{const s=c._s;if(s==null)return;conns[s]=null;
   if(G){G.type[s]='bot';G.names[s]+=' (bot)';sendAll();botTick()}else{L.type[s]='empty';L.names[s]='';lobbyBroadcast()}});
 });
};
$('go').onclick=()=>{newGame();sendAll();botTick()};
$('jn').onclick=()=>{
 if(!window.Peer){$('lt').textContent='PeerJS yüklenemedi.';return}
 const c=$('cd').value.trim().toUpperCase();if(c.length<4){$('lt').textContent='4 harfli oda kodunu yaz.';return}
 $('lt').textContent='Bağlanıyor...';peer=new Peer();
 peer.on('error',e=>$('lt').textContent='Bağlantı hatası: '+e.type);
 peer.on('open',()=>{conn=peer.connect('okey3d-'+c,{reliable:true});
  conn.on('open',()=>conn.send({t:'join',name:nm(),look:myLook()}));
  conn.on('data',d=>{
   if(d.t==='st')apply(d);
   else if(d.t==='tea'||d.t==='sip')onNet(d);
   else if(d.t==='lobby')$('lt').textContent=d.txt+'\n\nOda sahibinin başlatması bekleniyor...';
   else if(d.t==='full')$('lt').textContent='Oda dolu ya da oyun başlamış.';
   else if(d.t==='seat')me=d.seat});
  conn.on('close',()=>msg('Oda ile bağlantı koptu.'))});
};
