<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Okey 3D Kafe</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#182536}
#ui,#help{position:fixed;top:12px;background:#182536ee;color:#fff;padding:12px;border-radius:10px;z-index:5;font-size:13px;line-height:1.6}
#ui{left:12px}#help{display:none}
#tip{color:#9ed5ff}
#game{position:fixed;bottom:0;left:0;width:100%;background:linear-gradient(transparent,#101923 25%);padding:35px 12px 12px;z-index:5;color:#fff}
#tiles{display:flex;gap:5px;overflow-x:auto;justify-content:center;padding:14px 8px 6px}
.tile{flex:0 0 38px;height:56px;background:#f5edda;border:2px solid #c8bda5;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:bold;cursor:pointer;box-shadow:0 3px 5px #0008}
.tile.okey{border-color:#e6a400;background:#fff3c4}
.tile.selected{transform:translateY(-12px);border:3px solid #42baff}
#buttons{text-align:center;margin-top:6px}
#autoInfo{display:flex;justify-content:space-between;gap:12px;max-width:900px;margin:7px auto 0;padding:7px 12px;border-radius:8px;background:#0b1724cc;color:#d6eaff;font-size:13px;font-weight:bold}
#autoInfo span:last-child{text-align:right;color:#9ed5ff}
@media(max-width:600px){#autoInfo{font-size:11px;padding:6px;gap:6px}}
button{border:0;border-radius:8px;padding:10px 14px;margin:3px;background:#287ac0;color:#fff;font-weight:bold;cursor:pointer;font-size:14px}
button:disabled{opacity:.35;cursor:default}
#tea{background:#b8561a}#drinkCoffee{background:#f1f1f1;color:#30251d}#drinkCola{background:#a51f2d}#drinkTea{background:#b8561a}#pieceName{min-height:18px;text-align:center;color:#ffe3a6;font-weight:bold;font-size:14px}
#status{text-align:center;font-size:14px;color:#d6eaff}
#okeyInfo{text-align:center;margin:4px 0;color:#ffe3a6;font-size:14px;font-weight:bold}
#myHealth{display:none;text-align:center;margin:5px 0 2px;font-size:21px;font-weight:bold;color:#ff7180;text-shadow:0 2px 5px #000}
#lobby{position:fixed;inset:0;z-index:10;background:#182536f2;display:flex;align-items:center;justify-content:center;color:#fff}
.box{width:min(360px,92vw);text-align:center}
.box input{padding:10px;border-radius:8px;border:0;margin:4px;width:150px;font-size:15px}
#lobby .look{margin:6px 0 10px;font-size:14px}
#avatarPreview{width:220px;height:175px;margin:8px auto 10px;border:1px solid #58718a;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at center,#344b60,#101923)}
#avatarPreview canvas{display:block;width:100%;height:100%}
.lookRow{margin:5px 0}
.box input[type=color]{width:44px;height:32px;padding:0;margin:4px;border-radius:6px;vertical-align:middle}
.box select{padding:7px 9px;margin:4px;border:0;border-radius:7px;background:#fff;color:#182536;font-size:13px}
#modes{margin:6px 0 10px}#modes button{background:#3a4a5a}#modes button.on{background:#287ac0;outline:2px solid #9ed5ff}
#lt{margin:12px 0;color:#9ed5ff;min-height:20px;white-space:pre-line}
#chatPanel{position:fixed;right:14px;top:12px;bottom:auto;width:min(320px,calc(100vw - 28px));z-index:8;background:#102030ee;color:#fff;border:1px solid #54718b;border-radius:10px;padding:10px;display:block}
#chatLog{height:145px;overflow:auto;text-align:left;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:8px}
#chatRow{display:flex;gap:5px}#chatInput{min-width:0;flex:1;padding:9px;border:0;border-radius:7px}#chatSend{margin:0;padding:8px 12px}
#voiceBtn{background:#267b58}#voiceBtn.off{background:#7d3940}

/* İstenen iki kontrolü gizle; diğer butonların HTML ve işlevleri aynen kalsın. */
#gr, #cl { display: none !important; }
</style>
</head>
<body>
<div id="lobby"><div class="box">
<h2>Okey 3D Kafe</h2>
<div id="modes"><button id="m1" class="on">101 Okey</button><button id="m2">Satranç</button><button id="m3">Rus Ruleti</button><br><button id="bt" style="display:none">Botlar: Açık</button></div>
<input id="nm" placeholder="Adın" maxlength="12"><br>
<div id="avatarPreview" aria-label="Karakter önizlemesi"></div>
<div class="look">
<div class="lookRow">Karakter <select id="genderStyle"><option value="male">Erkek</option><option value="female">Kadın</option></select>　Saç <select id="hairStyle"><option value="classic">Kısa</option><option value="spiky">Hacimli</option><option value="side">Yana taralı</option><option value="long">Uzun düz</option><option value="bob">Küt</option><option value="pony">At kuyruğu</option><option value="braid">Örgülü</option><option value="curly">Kıvırcık</option><option value="pixie">Kısa katlı</option><option value="waves">Dalgalı uzun</option><option value="bun">Topuz</option><option value="afro">Kabarık bukle</option></select></div>
<div class="lookRow">Üst kıyafet <select id="shirtStyle"><option value="normal">Normal</option><option value="hoodie">Kapüşonlu</option><option value="jacket">Ceket</option></select>　Pantolon <select id="pantsStyle"><option value="normal">Normal</option><option value="jeans">Kot</option><option value="shorts">Şort</option></select></div>
<div class="lookRow">Üst renk <input type="color" id="cs" value="#2585dc"> Pantolon rengi <input type="color" id="cp" value="#252b35"></div><div class="lookRow">Saç rengi <input type="color" id="ch" value="#2b1b12"> Ten <input type="color" id="ck" value="#ffc38e"></div></div>
<button id="solo">Tek başına (botlarla)</button>
<button id="mk">Oda kur</button><br>
<input id="cd" placeholder="Oda kodu" maxlength="4">
<button id="jn">Odaya katıl</button>
<div id="lt"></div>
<button id="go" hidden>Oyunu başlat</button>
</div></div>

<div id="ui"><b>OKEY 3D KAFE</b><br>Fare sürükle: etrafa bak<br>E: Otur / Kalk · WASD: yürü<br><span id="tip"></span></div>
<div id="help"><b>101 OKEY</b><br>Oyun başlayınca gösterge burada.</div>

<div id="game">
<div id="status">Bir oyun başlat veya odaya katıl.</div>
<div id="pieceName" aria-live="polite"></div>
<div id="myHealth" aria-live="polite"></div>
<div id="buttons">
<button id="dp" disabled>Desteden çek</button>
<button id="dd" disabled>Soldan al</button>
<button id="ds" disabled>Taş at</button>
<button id="sd">Seri diz</button>
<button id="cf">Çift diz</button>
<button id="gr" disabled>Grupla</button>
<button id="op" disabled>Aç</button>
<button id="cl">Temizle</button>
<button id="sit">Otur / Kalk (E)</button>
<button id="voiceBtn" class="off" title="V tuşu">Ses: Kapalı (V)</button>
<button id="again" hidden>Tekrar oyna</button>
<button id="exit">Çık</button>
<button id="sf" style="display:none" disabled>Kendine ateş et</button>
<button id="sa" style="display:none" disabled>Ateş et</button>
<button id="drinkCola">🥤 Kola iste</button>
<button id="drinkTea">🍵 Çay iste</button>
<button id="drinkCoffee">☕ Kahve iste</button>
</div>
<div id="okeyInfo" aria-live="polite" style="display:none"></div>
<div id="autoInfo" aria-live="polite"><span id="autoTotal">Oto gruplanan: 0 taş</span><span id="autoPairs">Çift: 0 / 5 çift</span></div>
</div>
<div id="chatPanel"><div id="chatLog" aria-live="polite"></div><div id="chatRow"><input id="chatInput" maxlength="240" placeholder="Mesajını yaz..."><button id="chatSend">Gönder</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id);
const msg=t=>$('status').textContent=t;
let mode='okey',botsOn=true;const tbl=[];
const TC=['#d83b36','#2679c9','#259b5a','#292929'];
const CN=['kırmızı','mavi','yeşil','siyah'];

/* ---------- SAHNE ---------- */
const scene=new THREE.Scene();scene.background=new THREE.Color(0x1b130e);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffe6c4,0x2a1c12,.8));
const sun=new THREE.PointLight(0xffd9a0,150,40,2);sun.position.set(0,5.9,0);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
for(const[x,z]of[[-8.5,-5],[8.5,-5],[-8.5,5],[8.5,5]]){const l=new THREE.PointLight(0xffc27a,45,18,2);l.position.set(x,5.8,z);scene.add(l)}
function cube(w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c}));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}

cube(26,1,26,0x6a4a30,0,-.5,0);cube(26,9,1,0xe6d5b9,0,4.5,12);cube(26,.4,26,0x3b2a1e,0,9.2,0);cube(50,9,1,0xe6d5b9,0,4.5,-12);
cube(1,9,25,0xcdbb9f,-12,4.5,0);cube(1,9,25,0xcdbb9f,12,4.5,0);
for(const x of[-4,4]){const w=cube(5,3,.15,0x3b6f94,x,4,-11.4);w.material.emissive.set(0x1c4a6e)}
tbl.push(cube(5,.3,4,0x2f6b45,0,1.8,0));
for(const x of[-2,2])for(const z of[-1.5,1.5])tbl.push(cube(.25,1.8,.25,0x493020,x,.9,z));
const A=i=>i*2*Math.PI/(mode==='rou'?10:4);
const L2W=(s,x,z)=>{const a=A(s);return [x*Math.cos(a)+z*Math.sin(a),-x*Math.sin(a)+z*Math.cos(a)]};
const seatPos=i=>mode==='rou'?{x:Math.sin(A(i))*3.7,z:Math.cos(A(i))*3.7}:{x:Math.sin(A(i))*3.5,z:Math.cos(A(i))*3};
for(let i=0;i<4;i++){const g=new THREE.Group(),p=seatPos(i);g.position.set(p.x,0,p.z);g.rotation.y=A(i);scene.add(g);tbl.push(g);
 const add=(x,y,z,sx,sy,sz,c)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),new THREE.MeshStandardMaterial({color:c}));m.position.set(x,y,z);m.castShadow=true;g.add(m)};
 add(0,.85,0,1,.15,1,0x9a6238);add(0,1.5,.46,1,1.1,.12,0x80502c);
 for(const x of[-.4,.4])for(const z of[-.4,.4])add(x,.4,z,.1,.8,.1,0x493020)}
for(const p of[[-8.5,-5],[8.5,-5],[-8.5,5],[8.5,5]]){cube(3,.3,2,0x75472b,p[0],1.5,p[1]);for(const x of[-1,1])for(const z of[-.6,.6])cube(.2,1.5,.2,0x493020,p[0]+x,.75,p[1]+z)}
function lamp(x,z,y,r){const m=new THREE.MeshStandardMaterial({color:0xffd27a,emissive:0xffb347,emissiveIntensity:1.2,side:THREE.DoubleSide});
 const cord=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,9-y,6),new THREE.MeshStandardMaterial({color:0x111111}));cord.position.set(x,(9+y)/2,z);scene.add(cord);
 const sh=new THREE.Mesh(new THREE.ConeGeometry(r,r*.7,20,1,true),m);sh.position.set(x,y,z);scene.add(sh);
 const bulb=new THREE.Mesh(new THREE.SphereGeometry(r*.25,12,8),new THREE.MeshBasicMaterial({color:0xfff2c8}));bulb.position.set(x,y-r*.2,z);scene.add(bulb)}
lamp(0,0,6.3,1.1);for(const[x,z]of[[-8.5,-5],[8.5,-5],[-8.5,5],[8.5,5]])lamp(x,z,6.5,.7);
cube(5,1.3,1.5,0x68442b,0,.65,-9);cube(5.2,.15,1.7,0x3e281b,0,1.35,-9);

// deste yığını ve atılan taşlar

const discMesh=[0,1,2,3].map(i=>{const a=A(i),cm=()=>new THREE.MeshStandardMaterial({color:0xf5edda});
 const m=new THREE.Mesh(new THREE.BoxGeometry(.34,.07,.46),[cm(),cm(),cm(),cm(),cm(),cm()]);
 {const w=L2W(i,1.5,1.4);m.position.set(w[0],2.0,w[1])}m.rotation.y=a;m.castShadow=true;m.visible=false;scene.add(m);return m});

function makeTea(){const g=new THREE.Group();
// İnce belli geleneksel Türk çay bardağı
const glassProfile=[[.075,0],[.09,.025],[.12,.08],[.14,.15],[.13,.21],[.105,.27],[.095,.32],[.105,.36],[.12,.38]].map(p=>new THREE.Vector2(...p));
const glassMat=new THREE.MeshPhysicalMaterial({color:0xeaf6f5,transparent:true,opacity:.34,roughness:.08,metalness:0,clearcoat:1,clearcoatRoughness:.04,side:THREE.DoubleSide});
const glass=new THREE.Mesh(new THREE.LatheGeometry(glassProfile,32),glassMat);g.add(glass);
// Bardağın içinde görünen amber renkli çay
const teaProfile=[[0,.018],[.075,.025],[.105,.08],[.12,.14],[.105,.19],[.085,.215],[0,.215]].map(p=>new THREE.Vector2(...p));
const t=new THREE.Mesh(new THREE.LatheGeometry(teaProfile,32),new THREE.MeshStandardMaterial({color:0xc94b16,roughness:.22,metalness:0}));g.add(t);g.userData.liq=t;
// İnce cam ağız kenarı ve taban tabağı
const rim=new THREE.Mesh(new THREE.TorusGeometry(.116,.008,8,32),new THREE.MeshPhysicalMaterial({color:0xf4ffff,transparent:true,opacity:.55,roughness:.08}));rim.rotation.x=Math.PI/2;rim.position.y=.375;g.add(rim);
const saucer=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.02,24),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.35}));saucer.position.y=-.012;g.add(saucer);
const h=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.5,8),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));h.position.y=.2;g.add(h);
 g.scale.setScalar(.6);return g}
let cTex=null;
function makeCola(){const g=new THREE.Group();
 if(!cTex){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.fillStyle='#d8142a';x.fillRect(0,0,256,64);x.fillStyle='#fff';x.font='italic bold 34px Georgia,serif';x.textAlign='center';x.textBaseline='middle';x.fillText('Coca-Cola',128,32);x.fillRect(0,6,256,3);x.fillRect(0,55,256,3);cTex=new THREE.CanvasTexture(c);cTex.colorSpace=THREE.SRGBColorSpace}
 const pr=[[0,0],[.06,0],[.07,.02],[.07,.14],[.045,.22],[.03,.28],[.03,.32],[.035,.33],[.035,.345],[0,.345]].map(q=>new THREE.Vector2(q[0],q[1]));
 g.add(new THREE.Mesh(new THREE.LatheGeometry(pr,16),new THREE.MeshStandardMaterial({color:0x9fd8c0,transparent:true,opacity:.35,roughness:.1,side:THREE.DoubleSide})));
 const liq=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,.18,14),new THREE.MeshStandardMaterial({color:0x1a0a05,roughness:.2}));liq.position.y=.12;g.add(liq);g.userData.liq=liq;
 const lab=new THREE.Mesh(new THREE.CylinderGeometry(.073,.073,.09,16,1,true),new THREE.MeshStandardMaterial({map:cTex,side:THREE.DoubleSide}));lab.position.y=.1;g.add(lab);
 const cap=new THREE.Mesh(new THREE.CylinderGeometry(.037,.037,.02,12),new THREE.MeshStandardMaterial({color:0xd8142a}));cap.position.y=.355;g.add(cap);
 const h=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,.5,8),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));h.position.y=.2;g.add(h);
 return g}


function makeCoffee(){const g=new THREE.Group();
 // Kısa ve tombul, beyaz porselen Türk kahvesi fincanı
 const white=new THREE.MeshStandardMaterial({color:0xfafafa,roughness:.2,metalness:0,side:THREE.DoubleSide});
 // Geniş gövde, kısa yükseklik ve açık ağız: fincanın içi kapatılmaz.
 const profile=[[0,.035],[.105,.035],[.132,.042],[.15,.075],[.16,.145],[.16,.215],[.153,.245],[.13,.245],[.132,.218],[.137,.16],[.126,.085],[.105,.062],[0,.062]].map(p=>new THREE.Vector2(...p));
 const mug=new THREE.Mesh(new THREE.LatheGeometry(profile,48),white);g.add(mug);
 // Kahve yüzeyi ağız içinde, koyu kahverengi ve açıkça görünür.
 const coffee=new THREE.Mesh(new THREE.CircleGeometry(.128,48),new THREE.MeshStandardMaterial({color:0x100502,emissive:0x080301,emissiveIntensity:.18,roughness:.18,metalness:0,side:THREE.DoubleSide}));coffee.rotation.x=-Math.PI/2;coffee.position.y=.207;g.add(coffee);g.userData.liq=coffee;
 // İnce porselen ağız kenarı
 const rim=new THREE.Mesh(new THREE.TorusGeometry(.156,.007,12,48),white);rim.rotation.x=Math.PI/2;rim.position.y=.244;g.add(rim);
 // Yuvarlak kulp, fincan gövdesinin yanına bağlı
 const handle=new THREE.Mesh(new THREE.TorusGeometry(.066,.017,12,32),white);handle.position.set(.17,.135,0);g.add(handle);
 // Geniş, hafif çukur beyaz tabak
 const saucerProfile=[[0,-.012],[.12,-.012],[.19,-.009],[.215,.002],[.205,.014],[.14,.019],[0,.016]].map(p=>new THREE.Vector2(...p));
 const saucer=new THREE.Mesh(new THREE.LatheGeometry(saucerProfile,48),white);g.add(saucer);
 const hit=new THREE.Mesh(new THREE.CylinderGeometry(.29,.29,.5,8),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));hit.position.y=.13;g.add(hit);
 g.scale.setScalar(.68);return g}

const dark=new THREE.MeshStandardMaterial({color:0x252b35});
const blk=new THREE.MeshStandardMaterial({color:0x151515}),lip=new THREE.MeshStandardMaterial({color:0xb5483f});
function person(col,hc=0x2b1b12,sk=0xffc38e,targetScene=scene){
 const p=new THREE.Group(),sh=new THREE.MeshStandardMaterial({color:col}),hm=new THREE.MeshStandardMaterial({color:hc}),skin=new THREE.MeshStandardMaterial({color:sk}),pants=new THREE.MeshStandardMaterial({color:0x252b35});
 const add=(g,m,x,y,z)=>{m.position.set(x,y,z);m.castShadow=true;g.add(m);return m};
 // Mevcut yuvarlak kafa ve gövde korunur.
 add(p,new THREE.Mesh(new THREE.CylinderGeometry(.35,.45,1.1,6),sh),0,1.25,0);
 add(p,new THREE.Mesh(new THREE.IcosahedronGeometry(.4,1),skin),0,2.1,0);
 // Saçın klasik modeli, eski karakterdekiyle aynı geometri.
 const hair=new THREE.Group();p.add(hair);
 add(hair,new THREE.Mesh(new THREE.SphereGeometry(.44,16,12,0,Math.PI*2,0,Math.PI*.5),hm),0,2.17,-.03);
 const fringe=add(hair,new THREE.Mesh(new THREE.BoxGeometry(.5,.1,.12),hm),0,2.36,.33);
 // Dikenli saç modeli
 const spikes=new THREE.Group();hair.add(spikes);
 for(let i=0;i<7;i++){
  const a=i*Math.PI*2/7;
  const q=new THREE.Mesh(new THREE.ConeGeometry(.095,.25,7),hm);
  q.position.set(Math.cos(a)*.25,2.39,Math.sin(a)*.25);
  q.rotation.z=Math.cos(a)*-.45;q.rotation.x=Math.sin(a)*.45;
  q.castShadow=true;spikes.add(q);
 }
 spikes.visible=false;
 // Yana taralı saç
 const sideHair=add(hair,new THREE.Mesh(new THREE.BoxGeometry(.42,.13,.22),hm),-.13,2.37,.27);
 sideHair.rotation.z=-.18;sideHair.visible=false;
 // Uzun saç: iki yandaki tutamlar
 const longHair=new THREE.Group();hair.add(longHair);
 const backHair=new THREE.Mesh(new THREE.SphereGeometry(.34,14,12),hm);backHair.position.set(0,1.91,-.24);backHair.scale.set(1.12,1.45,.78);backHair.castShadow=true;longHair.add(backHair);
 for(const x of[-.32,.32]){
  const q=new THREE.Mesh(new THREE.CylinderGeometry(.09,.12,.88,10),hm);
  q.position.set(x,1.82,.19);q.scale.set(1,1.08,1);q.castShadow=true;longHair.add(q);
 }
 longHair.visible=false;
 // Küt saç: başın arkasını ve yanlarını saran, omuz hizasında biten model.
 const bobHair=new THREE.Group();hair.add(bobHair);
 const bobBack=new THREE.Mesh(new THREE.SphereGeometry(.39,16,14),hm);bobBack.position.set(0,2.00,-.12);bobBack.scale.set(1.13,1.08,.95);bobBack.castShadow=true;bobHair.add(bobBack);
 for(const x of[-.34,.34]){const q=new THREE.Mesh(new THREE.CylinderGeometry(.105,.12,.58,12),hm);q.position.set(x,1.92,.19);q.scale.set(.92,1.12,1);q.rotation.z=x*.16;q.castShadow=true;bobHair.add(q)}
 bobHair.visible=false;
 // At kuyruğu: arkada belirgin, aşağı doğru uzanan kuyruk ve saç tokası.
 const ponyHair=new THREE.Group();hair.add(ponyHair);
 const ponyBase=new THREE.Mesh(new THREE.SphereGeometry(.37,14,12),hm);ponyBase.position.set(0,2.16,-.04);ponyBase.scale.set(1.08,.78,.95);ponyBase.castShadow=true;ponyHair.add(ponyBase);
 const pony=new THREE.Mesh(new THREE.CylinderGeometry(.055,.095,.82,12),hm);pony.position.set(.40,1.78,-.10);pony.rotation.z=-.22;pony.rotation.x=-.12;pony.castShadow=true;ponyHair.add(pony);
 const tie=new THREE.Mesh(new THREE.TorusGeometry(.075,.025,8,16),new THREE.MeshStandardMaterial({color:0x6b4b9b}));tie.position.set(.37,1.98,-.07);tie.rotation.x=Math.PI/2;ponyHair.add(tie);
 ponyHair.visible=false;

function fillRack(i,items){

 for(let row=0;row<2;row++){
  const from=row*rowCount,to=Math.min(items.length,from+rowCount),rowItems=items.slice(from,to);
  if(!rowItems.length)continue;

  if(i===me&&autoGroupMode!=='none'){
   // Yalnızca otomatik dizme sırasında gerçekten seçilen perleri vurgula.
   // Elde yan yana gelen rastgele taşları sonradan per sanma.
   const idToIndex=new Map(rowItems.map((t,k)=>[t?.id,k]));
   for(const group of autoGroupGroups){
    const indexes=group.map(t=>idToIndex.get(t.id)).filter(k=>k!==undefined).sort((a,b)=>a-b);
    for(const k of indexes)groupedIds.add(rowItems[k].id);

   }

$('jn').onclick=()=>{
 if(!window.Peer){$('lt').textContent='PeerJS yüklenemedi.';return}
 const c=$('cd').value.trim().toUpperCase();if(c.length<4){$('lt').textContent='4 harfli oda kodunu yaz.';return}
 $('lt').textContent='Bağlanıyor...';peer=new Peer();
 peer.on('error',e=>$('lt').textContent='Bağlantı hatası: '+e.type);
 peer.on('call',handleVoiceCall);
 peer.on('open',()=>{conn=peer.connect('okey3d-'+c,{reliable:true});
  conn.on('open',()=>conn.send({t:'join',name:nm(),look:myLook(),peerId:peer.id}));
  conn.on('data',d=>{
   if(d.t==='chat')receiveChat(d);
   else if(d.t==='st')apply(d);
   else if(d.t==='tea'||d.t==='sip')onNet(d);
   else if(d.t==='pos')onPos(d);
   else if(d.t==='lobby')$('lt').textContent=d.txt+'\n\nOda sahibinin başlatması bekleniyor...';
   else if(d.t==='full')$('lt').textContent='Oda dolu ya da oyun başlamış.';
   else if(d.t==='seat'){me=d.seat;mode=d.mode||'okey';hostPeerId=d.hostPeerId||('okey3d-'+c)}});
  conn.on('close',()=>msg('Oda ile bağlantı koptu.'))});
};
</script>
</body>
</html>
