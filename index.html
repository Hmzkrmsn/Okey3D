
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Okey 3D Cafe</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#182536}
#ui{
position:fixed;top:12px;left:12px;
background:#182536eF;color:white;
padding:14px;border-radius:12px;
z-index:5;line-height:1.7;font-size:14px
}
#tip{color:#9ed5ff}
#help{
position:fixed;top:12px;right:12px;
background:#182536eF;color:white;
padding:12px;border-radius:10px;
z-index:5;font-size:13px
}
#game{
position:fixed;bottom:0;left:0;width:100%;
background:linear-gradient(transparent,#101923 25%);
padding:35px 12px 12px;z-index:5;color:white;
}
#tiles{
display:flex;gap:5px;overflow-x:auto;
justify-content:center;padding:8px;
}
.tile{
flex:0 0 39px;height:58px;background:#f5edda;
border:2px solid #c8bda5;border-radius:6px;
display:flex;align-items:center;justify-content:center;
font-size:21px;font-weight:bold;cursor:pointer;
box-shadow:0 3px 5px #0008;
}
.tile.selected{transform:translateY(-12px);border:3px solid #42baff}
#buttons{text-align:center;margin-top:8px}
button{
border:0;border-radius:8px;padding:10px 17px;
margin:3px;background:#287ac0;color:white;
font-weight:bold;cursor:pointer
}
button:disabled{opacity:.4}
#status{text-align:center;font-size:13px;color:#d6eaff}
</style>
</head>
<body>

<div id="ui">
<b>OKEY 3D CAFE</b><br>
WASD: Hareket<br>
Fare: Kamera<br>
E: Otur / Kalk<br>
<span id="tip">Kahvehaneye hoş geldin!</span>
</div>

<div id="help">
<b>101 OKEY</b><br>
Taşlarını seçebilirsin.<br>
Diğer oyuncuların taşları gizli.
</div>

<div id="game">
<div id="status">Masaya yaklaş ve E tuşuna bas!</div>
<div id="tiles"></div>
<div id="buttons">
<button id="draw">Taş çek</button>
<button id="discard">Taş at</button>
<button id="sit">Otur / Kalk (E)</button>
</div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bc4dc);

const camera=new THREE.PerspectiveCamera(
70,innerWidth/innerHeight,.1,100
);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(8,15,8);
sun.castShadow=true;
scene.add(sun);

function cube(w,h,d,c,x,y,z){
const m=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({color:c})
);
m.position.set(x,y,z);
m.castShadow=true;
m.receiveShadow=true;
scene.add(m);
return m;
}

function cylinder(r,h,c,x,y,z){
const m=new THREE.Mesh(
new THREE.CylinderGeometry(r,r,h,12),
new THREE.MeshStandardMaterial({color:c})
);
m.position.set(x,y,z);
m.castShadow=true;
scene.add(m);
return m;
}

// KAFE
cube(50,1,50,0x829b70,0,-.5,0);
cube(50,9,1,0xe6d5b9,0,4.5,-12);
cube(1,9,25,0xcdbb9f,-12,4.5,0);
cube(1,9,25,0xcdbb9f,12,4.5,0);

// PENCERELER
cube(5,3,.15,0x76b9d4,-4,4,-11.4);
cube(5,3,.15,0x76b9d4,4,4,-11.4);

// ANA MASA
cube(4,.3,3,0x75472b,0,1.5,0);
for(const x of [-1.5,1.5])
for(const z of [-1,1])
cube(.25,1.5,.25,0x493020,x,.75,z);

// MASA TAŞLARI
const colors=[0xe74c3c,0x3285dc,0x2ca66b,0xe5d8b7];
for(let i=0;i<16;i++){
cube(.35,.17,.55,colors[i%4],
-1.5+(i%8)*.42,1.74,-.5+Math.floor(i/8)*.8);
}

// SANDALYELER
for(let a=0;a<4;a++){
const angle=a*Math.PI/2;
const x=Math.sin(angle)*3;
const z=Math.cos(angle)*2.5;
cube(1,.3,1,0x80502c,x,.8,z);
cube(1.1,1.3,.2,0x80502c,
x,1.4,z+Math.cos(angle)*.5);
}

// EK MASALAR
for(const p of [[-7,0,-5],[7,0,-5],[-7,0,5],[7,0,5]]){
cube(3,.3,2,0x75472b,p[0],1.5,p[2]);
for(const x of [-1,1])
for(const z of [-.6,.6])
cube(.2,1.5,.2,0x493020,p[0]+x,.75,p[2]+z);
}

// GARSON TEZGAHI
cube(5,1.3,1.5,0x68442b,0,.65,-9);
cube(5.2,.15,1.7,0x3e281b,0,1.35,-9);

// ÇAY BARDAĞI
const glass=new THREE.Mesh(
new THREE.CylinderGeometry(.16,.12,.4,12),
new THREE.MeshStandardMaterial({
color:0xe6eeee,transparent:true,opacity:.6
})
);
glass.position.set(3,.3,-3);
scene.add(glass);

const tea=new THREE.Mesh(
new THREE.CylinderGeometry(.13,.1,.2,12),
new THREE.MeshStandardMaterial({color:0xc66a19})
);
tea.position.set(3,.28,-3);
scene.add(tea);

// OYUNCU KARAKTERİ
const player=new THREE.Group();

const blue=new THREE.MeshStandardMaterial({color:0x2585dc});
const skin=new THREE.MeshStandardMaterial({color:0xffc38e});
const dark=new THREE.MeshStandardMaterial({color:0x252b35});

const body=new THREE.Mesh(
new THREE.CylinderGeometry(.35,.45,1.1,6),blue
);
body.position.y=1.25;
player.add(body);

const head=new THREE.Mesh(
new THREE.IcosahedronGeometry(.4,1),skin
);
head.position.y=2.1;
player.add(head);

for(const x of [-.22,.22]){
const leg=new THREE.Mesh(
new THREE.BoxGeometry(.2,.8,.2),dark
);
leg.position.set(x,.4,0);
player.add(leg);
}

for(const x of [-.45,.45]){
const arm=new THREE.Mesh(
new THREE.BoxGeometry(.2,.85,.2),skin
);
arm.position.set(x,1.35,0);
player.add(arm);
}

player.position.set(0,0,6);
scene.add(player);

// OYUN DURUMU
let seated=false;
let selected=-1;
let hand=[];
let pile=[];

const numbers=[];
for(let i=1;i<=13;i++){
for(let c=0;c<4;c++){
numbers.push({n:i,c});
numbers.push({n:i,c});
}
}
numbers.sort(()=>Math.random()-.5);
hand=numbers.splice(0,21);
pile=numbers;

const tileColors=['#d83b36','#2679c9','#259b5a','#292929'];

function renderHand(){
const area=document.getElementById('tiles');
area.innerHTML='';
hand.sort((a,b)=>a.c-b.c||a.n-b.n);

hand.forEach((t,i)=>{
const el=document.createElement('div');
el.className='tile'+(selected===i?' selected':'');
el.style.color=tileColors[t.c];
el.textContent=t.n;
el.onclick=()=>{
selected=selected===i?-1:i;
renderHand();
};
area.appendChild(el);
});
}

renderHand();

function message(t){
document.getElementById('status').textContent=t;
}

function drawTile(){
if(!seated){
message('Önce masaya oturmalısın!');
return;
}
if(hand.length>=22){
message('Elinde yeterince taş var!');
return;
}
if(!pile.length){
message('Taş kalmadı!');
return;
}
hand.push(pile.pop());
selected=-1;
renderHand();
message('Taş çektin!');
}

function discardTile(){
if(!seated){
message('Önce masaya oturmalısın!');
return;
}
if(selected<0){
message('Önce atacağın taşı seç!');
return;
}
hand.splice(selected,1);
selected=-1;
renderHand();
message('Taşını attın!');
}

document.getElementById('draw').onclick=drawTile;
document.getElementById('discard').onclick=discardTile;

function sitToggle(){
const distance=player.position.distanceTo(
new THREE.Vector3(0,0,0)
);
if(!seated && distance>5){
message('Oturmak için masaya yaklaş!');
return;
}
seated=!seated;
if(seated){
player.position.set(0,0,3);
message('Masaya oturdun! Taşlarını oynayabilirsin.');
document.getElementById('tip').textContent='Masadasın!';
}else{
message('Masadan kalktın. Gezebilirsin.');
document.getElementById('tip').textContent='Kafede geziyorsun.';
}
}

document.getElementById('sit').onclick=sitToggle;

// HAREKET VE KAMERA
const keys={};
addEventListener('keydown',e=>{
keys[e.key.toLowerCase()]=true;
if(e.key.toLowerCase()==='e'&&!e.repeat)sitToggle();
});
addEventListener('keyup',e=>{
keys[e.key.toLowerCase()]=false;
});

let yaw=0,pitch=.25,drag=false,lx=0,ly=0;

renderer.domElement.addEventListener('pointerdown',e=>{
drag=true;
lx=e.clientX;
ly=e.clientY;
});
addEventListener('pointerup',()=>drag=false);

addEventListener('pointermove',e=>{
if(!drag)return;
yaw-=(e.clientX-lx)*.005;
pitch=Math.max(-.1,Math.min(1,
pitch+(e.clientY-ly)*.005));
lx=e.clientX;
ly=e.clientY;
});

function animate(){
requestAnimationFrame(animate);

if(!seated){
const f=(keys.w?1:0)-(keys.s?1:0);

// A ve D yönleri ters çevrildi
const r=(keys.a?1:0)-(keys.d?1:0);

const speed=.09;
player.position.x+=(Math.sin(yaw)*f+Math.cos(yaw)*r)*speed;
player.position.z+=(Math.cos(yaw)*f-Math.sin(yaw)*r)*speed;

player.position.x=Math.max(-10,Math.min(10,player.position.x));
player.position.z=Math.max(-10,Math.min(10,player.position.z));
}

const t=player.position;

const targetCamera=new THREE.Vector3(
t.x-Math.sin(yaw)*8,
t.y+4+pitch*2,
t.z-Math.cos(yaw)*8
);

camera.position.lerp(targetCamera,.12);
camera.lookAt(t.x,t.y+1.2,t.z);

renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
